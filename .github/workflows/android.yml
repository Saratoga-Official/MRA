name: android

# 用 MaaFwApp（MaaFramework 的通用 Android GUI）把 MRA 资源打进 APK，替换原先由
# install.yml 交叉打包的 android 产物。参考 MAA1999/M9A 的写法。
#
# 日常 debug：push / PR 自动触发。手动 dispatch 可选 debug/release 与 MaaFramework tag。
# 打 v* tag 时出 release 包并附到对应 Release。

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/workflows/android.yml"
      - "pi-profile.yaml"
      - "assets/**"
      - "agent/**"
      - "**.py"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/android.yml"
      - "pi-profile.yaml"
      - "assets/**"
      - "agent/**"
      - "**.py"
  workflow_dispatch:
    inputs:
      assemble:
        description: "debug 或 release（release 需配置 keystore secrets，否则出未签名包）"
        type: choice
        options:
          - debug
          - release
        default: debug
      maafw_tag:
        description: "MaaFramework release tag；留空用下方 MAAFW_TAG 固定值"
        required: false
        default: ""

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # MaaFramework Android 产物版本，须 >= MaaFwApp 支持的最低版本（v5.13.0）。
  MAAFW_TAG: "v5.14.1"
  # MaaFwApp 仓库与固定 ref（锁版本更稳，避免上游 main 变动打断构建）。留空取默认分支。
  MAAFWAPP_REPO: "Aliothmoon/MaaFwApp"
  MAAFWAPP_REF: ""

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: set_tag
        run: |
          is_release=${{ startsWith(github.ref, 'refs/tags/v') }}
          tag=$(git describe --tags --match "v*" ${{ github.ref }} || true)
          if [[ $tag != v* ]]; then
            tag=$(curl -sX GET "https://api.github.com/repos/${{ github.repository }}/releases/latest" --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' | awk '/tag_name/{print $4}' FS='["]')
            if [[ $tag != v* ]]; then
              tag="v0.0.0"
            fi
            tag=$(date "+$tag-%y%m%d-$(git rev-parse --short HEAD)")
          fi
          if ! $($is_release) ; then
            prefix=${tag%-*-*}
            suffix=${tag#$prefix-}
            tag="$prefix-ci.$suffix"
          fi
          is_prerelease=false
          if [[ $tag =~ .*alpha.* || $tag =~ .*beta.* || $tag =~ .*rc.* || $tag =~ .*dev.* || $tag =~ .*-ci.* ]]; then
            is_prerelease=true
          fi
          echo tag=$tag | tee -a $GITHUB_OUTPUT
          echo is_release=$is_release | tee -a $GITHUB_OUTPUT
          echo is_prerelease=$is_prerelease | tee -a $GITHUB_OUTPUT
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
      is_prerelease: ${{ steps.set_tag.outputs.is_prerelease }}

  build:
    needs: meta
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      # dispatch 未选时默认 debug
      ASSEMBLE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.assemble || 'debug' }}
    steps:
      # 1) 检出 MRA（含子模块，MaaCommonAssets 提供 OCR 模型）
      - name: Checkout MRA
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      # 2) 检出 MaaFwApp 到仓库内 Android/MaaFwApp（与 M9A 的子模块布局一致，
      #    使 pi-profile.yaml 的相对路径 agent-dist 稳定落在仓库内）
      - name: Checkout MaaFwApp
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MAAFWAPP_REPO }}
          ref: ${{ env.MAAFWAPP_REF || '' }}
          path: Android/MaaFwApp

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3) 生成 OCR 模型，并把 agent / LICENSE / 图标铺进 assets/
      #    （include 相对 assets 目录，故这些文件要落在 assets/ 下）
      - name: Stage PI assets
        shell: bash
        run: |
          python configure.py
          cp -r agent assets/agent
          cp LICENSE assets/LICENSE
          # interface.json 图标是 logo.ico；Android 不解码 ico，转出 png 供 launcher 用
          sudo apt-get update && sudo apt-get install -y imagemagick
          convert "logo.ico[0]" assets/logo.png
          # interface.json 版本号占位替换成本次 tag
          python - <<'PY'
          import json
          p = "assets/interface.json"
          with open(p, encoding="utf-8") as f:
              data = json.load(f)
          tag = "${{ needs.meta.outputs.tag }}"
          data["version"] = tag
          data["title"] = f"MRA {tag} | 舰R小助手"
          with open(p, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=4)
          PY

      # 4) 铺 MaaFramework Android .so（debug 只 arm64；release 出双 ABI）
      - name: Setup MaaFramework native libs
        shell: bash
        working-directory: Android/MaaFwApp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAAFW_TAG_OVERRIDE: ${{ github.event.inputs.maafw_tag }}
        run: |
          TAG="${MAAFW_TAG_OVERRIDE:-$MAAFW_TAG}"
          if [ "$ASSEMBLE" = "release" ]; then
            python scripts/setup_maa_framework.py --abi arm64-v8a --tag "$TAG"
            python scripts/setup_maa_framework.py --abi x86_64 --tag "$TAG"
          else
            python scripts/setup_maa_framework.py --abi arm64-v8a --tag "$TAG"
          fi

      # 5) 组装内嵌 Python 的 agent 运行时。ABI 与上面的 .so、以及 build.*Abi 对齐。
      - name: Build agent bundle
        shell: bash
        working-directory: Android/MaaFwApp
        run: |
          if [ "$ASSEMBLE" = "release" ]; then
            ABIS="--abi arm64-v8a --abi x86_64"
          else
            ABIS="--abi arm64-v8a"
          fi
          python scripts/build_agent_bundle.py \
            --out "${GITHUB_WORKSPACE}/agent-dist" \
            $ABIS \
            --requirements "${GITHUB_WORKSPACE}/agent/requirements.txt"

      # 6) 指定配方与 ABI
      - name: Write local.properties
        shell: bash
        working-directory: Android/MaaFwApp
        run: |
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "pi.profile=${GITHUB_WORKSPACE}/pi-profile.yaml"
            if [ "$ASSEMBLE" != "release" ]; then
              echo "build.debugAbi=arm64-v8a"
            fi
          } > local.properties
          echo "BUILD_VERSION_NAME=${{ needs.meta.outputs.tag }}" >> "$GITHUB_ENV"

      - name: Decode keystore
        if: env.ASSEMBLE == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/release.jks"
          fi

      # 7) 出包
      - name: Build APK
        shell: bash
        working-directory: Android/MaaFwApp
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ "$ASSEMBLE" = "release" ]; then
            ./gradlew clean :app:assembleRelease --no-daemon
            variant=release
          else
            ./gradlew clean :app:assembleDebug --no-daemon
            variant=debug
          fi
          out="${GITHUB_WORKSPACE}/apk-out"
          mkdir -p "$out"
          apk=$(find app/build/outputs/apk/$variant -name "*.apk" | head -n 1)
          cp "$apk" "$out/MRA-${{ needs.meta.outputs.tag }}-android-${variant}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MRA-android-apk
          path: apk-out
          if-no-files-found: error

  release:
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MRA-android-apk
          path: apk-out
      - uses: softprops/action-gh-release@v2.2.2
        with:
          files: apk-out/*.apk
          tag_name: ${{ needs.meta.outputs.tag }}
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}
