name: android

# 用 MaaFwApp（MaaFramework 的通用 Android GUI）把 MRA 资源打进 APK。
# 触发条件与 install.yml 对齐：改动资源 / agent / 本 workflow / 打 tag 时构建。
on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/workflows/android.yml"
      - "pi-profile.yaml"
      - "assets/**"
      - "agent/**"
      - "**.py"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/android.yml"
      - "pi-profile.yaml"
      - "assets/**"
      - "agent/**"
      - "**.py"
  workflow_dispatch:

permissions:
  contents: write

env:
  # MaaFramework Android 产物版本；与 MaaFwApp 支持的最低版本（>= v5.13.0）保持一致。
  MAAFW_TAG: "v5.14.1"
  # MaaFwApp 仓库与固定 ref。用固定 tag/commit 更稳，避免上游 main 变动打断构建；
  # 需要升级时改这里。为空则取默认分支。
  MAAFWAPP_REPO: "Aliothmoon/MaaFwApp"
  MAAFWAPP_REF: ""

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: set_tag
        run: |
          is_release=${{ startsWith(github.ref, 'refs/tags/v') }}
          tag=$(git describe --tags --match "v*" ${{ github.ref }} || true)
          if [[ $tag != v* ]]; then
            tag=$(curl -sX GET "https://api.github.com/repos/${{ github.repository }}/releases/latest" --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' | awk '/tag_name/{print $4}' FS='["]')
            if [[ $tag != v* ]]; then
              tag="v0.0.0"
            fi
            tag=$(date "+$tag-%y%m%d-$(git rev-parse --short HEAD)")
          fi
          if ! $($is_release) ; then
            prefix=${tag%-*-*}
            suffix=${tag#$prefix-}
            tag="$prefix-ci.$suffix"
          fi
          is_prerelease=false
          if [[ $tag =~ .*alpha.* || $tag =~ .*beta.* || $tag =~ .*rc.* || $tag =~ .*dev.* || $tag =~ .*-ci.* ]]; then
            is_prerelease=true
          fi
          echo tag=$tag | tee -a $GITHUB_OUTPUT
          echo is_release=$is_release | tee -a $GITHUB_OUTPUT
          echo is_prerelease=$is_prerelease | tee -a $GITHUB_OUTPUT
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
      is_prerelease: ${{ steps.set_tag.outputs.is_prerelease }}

  build:
    needs: meta
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      # 1) 检出 MRA（含子模块，MaaCommonAssets 提供 OCR 模型）
      - name: Checkout MRA
        uses: actions/checkout@v4
        with:
          submodules: true
          path: MRA

      # 2) 检出 MaaFwApp（打包外壳）
      - name: Checkout MaaFwApp
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MAAFWAPP_REPO }}
          ref: ${{ env.MAAFWAPP_REF || '' }}
          path: MaaFwApp

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3) 生成 OCR 模型，并把 agent / LICENSE / 图标铺进 assets/
      #    打包白名单相对 assets/ 计算，故这些文件要落在 assets/ 根下。
      - name: Stage PI assets
        shell: bash
        working-directory: MRA
        run: |
          python configure.py
          cp -r agent assets/agent
          cp LICENSE assets/LICENSE
          # interface.json 图标是 logo.ico；Android 不解码 ico，转出 png 供 launcher 用
          sudo apt-get update && sudo apt-get install -y imagemagick
          convert "logo.ico[0]" assets/logo.png
          # interface.json 版本号占位替换成本次 tag
          python - "$GITHUB_ENV" <<'PY'
          import json, os, sys
          p = "assets/interface.json"
          with open(p, encoding="utf-8") as f:
              data = json.load(f)
          tag = "${{ needs.meta.outputs.tag }}"
          data["version"] = tag
          data["title"] = f"MRA {tag} | 舰R小助手"
          with open(p, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=4)
          PY

      # 4) 铺 MaaFramework Android .so
      - name: Setup MaaFramework native libs
        shell: bash
        working-directory: MaaFwApp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/setup_maa_framework.py --tag "${MAAFW_TAG}"

      # 5) 组装内嵌 Python 的 agent 运行时（两个 ABI）
      - name: Build agent bundle
        shell: bash
        working-directory: MaaFwApp
        run: |
          python scripts/build_agent_bundle.py \
            --out "${GITHUB_WORKSPACE}/agent-dist" \
            --abi arm64-v8a --abi x86_64 \
            --requirements "${GITHUB_WORKSPACE}/MRA/agent/requirements.txt"

      # 6) 指定打包配方与其引用的路径
      - name: Configure build profile
        shell: bash
        working-directory: MaaFwApp
        run: |
          echo "pi.profile=${GITHUB_WORKSPACE}/MRA/pi-profile.yaml" >> local.properties
          {
            echo "MRA_ASSETS_DIR=${GITHUB_WORKSPACE}/MRA/assets"
            echo "MRA_AGENT_DIST=${GITHUB_WORKSPACE}/agent-dist"
            echo "MRA_APP_ICON=${GITHUB_WORKSPACE}/MRA/assets/logo.png"
            echo "BUILD_VERSION_NAME=${{ needs.meta.outputs.tag }}"
          } >> "$GITHUB_ENV"

      # 7) 出包。默认 debug 签名，装机即用；配了 keystore secrets 则出 release 签名包。
      - name: Build APK
        id: build_apk
        shell: bash
        working-directory: MaaFwApp
        env:
          KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [[ -n "${KEYSTORE_PATH}" ]]; then
            ./gradlew :app:assembleRelease --no-daemon
            variant=release
          else
            echo "未配置 ANDROID_KEYSTORE_* secrets，出 debug 签名包"
            ./gradlew :app:assembleDebug --no-daemon
            variant=debug
          fi
          out="${GITHUB_WORKSPACE}/apk-out"
          mkdir -p "$out"
          apk=$(find app/build/outputs/apk/$variant -name "*.apk" | head -n 1)
          cp "$apk" "$out/MRA-${{ needs.meta.outputs.tag }}-android-${variant}.apk"
          echo "variant=$variant" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: MRA-android-apk
          path: apk-out

  release:
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MRA-android-apk
          path: apk-out
      - uses: softprops/action-gh-release@v2.2.2
        with:
          files: apk-out/*.apk
          tag_name: ${{ needs.meta.outputs.tag }}
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}
