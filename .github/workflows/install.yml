name: install

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "agent/**"
      - "**.py"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "agent/**"
      - "**.py"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  packages: write

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: set_tag
        run: |
          is_release=${{ startsWith(github.ref, 'refs/tags/v') }}
          tag=$(git describe --tags --match "v*" ${{ github.ref }} || true)
          if [[ $tag != v* ]]; then
            tag=$(curl -sX GET "https://api.github.com/repos/${{ github.repository }}/releases/latest" --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' | awk '/tag_name/{print $4}' FS='["]')
            if [[ $tag != v* ]]; then
              tag="v0.0.0"
            fi
            tag=$(date "+$tag-%y%m%d-$(git rev-parse --short HEAD)")
          fi
          if ! $($is_release) ; then
            prefix=${tag%-*-*}
            suffix=${tag#$prefix-}
            tag="$prefix-ci.$suffix"
          fi
          is_prerelease=false
          if [[ $tag =~ .*alpha.* || $tag =~ .*beta.* || $tag =~ .*rc.* || $tag =~ .*dev.* || $tag =~ .*-ci.* ]]; then
            is_prerelease=true
          fi
          echo tag=$tag | tee -a $GITHUB_OUTPUT
          echo is_release=$is_release | tee -a $GITHUB_OUTPUT
          echo is_prerelease=$is_prerelease | tee -a $GITHUB_OUTPUT
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
      is_prerelease: ${{ steps.set_tag.outputs.is_prerelease }}

  install:
    needs: meta
    runs-on: ${{ matrix.runs-on }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      matrix:
        include:
          - os: win
            arch: x86_64
            runs-on: windows-latest
          - os: win
            arch: aarch64
            runs-on: windows-11-arm
          - os: macos
            arch: x86_64
            runs-on: macos-13
          - os: macos
            arch: aarch64
            runs-on: macos-latest
          - os: linux
            arch: x86_64
            runs-on: ubuntu-latest
          - os: linux
            arch: aarch64
            runs-on: ubuntu-24.04-arm
          - os: android
            arch: x86_64
            runs-on: ubuntu-latest
          - os: android
            arch: aarch64
            runs-on: ubuntu-latest
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download MaaFramework
        uses: robinraju/release-downloader@v1.10
        with:
          repository: MaaXYZ/MaaFramework
          fileName: "MAA-${{ matrix.os }}-${{ matrix.arch }}*"
          tag: 'v5.10.2'
          out-file-path: "deps"
          extract: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download MFAAvalonia
        if: matrix.os != 'android'
        id: download_mfa
        uses: robinraju/release-downloader@v1.10
        with:
          repository: MaaXYZ/MFAAvalonia
          fileName: "MFAAvalonia-*-${{ (matrix.os == 'win' && 'win') || (matrix.os == 'macos' && 'osx') || (matrix.os == 'linux' && 'linux') }}-${{ (matrix.arch == 'x86_64' && 'x64') || (matrix.arch == 'aarch64' && 'arm64') }}*"
          tag: 'v2.12.0'
          out-file-path: "MFA"
          extract: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up MFAAvalonia archive
        if: matrix.os != 'android'
        shell: bash
        run: |
          ARCHIVE_FILE_PATH="${{ fromJson(steps.download_mfa.outputs.downloaded_files)[0] }}"
          rm -f "${ARCHIVE_FILE_PATH}"

      - name: Remove built-in runtime in MFA
        if: matrix.os != 'android'
        shell: bash
        run: rm -rf MFA/runtimes

      - name: Download MXU
        if: matrix.os != 'android' && (matrix.os != 'linux' || matrix.arch == 'x86_64')
        id: download_mxu
        uses: robinraju/release-downloader@v1.10
        with:
          repository: MistEO/MXU
          fileName: "MXU-${{ matrix.os }}-${{ matrix.arch }}*"
          tag: 'v2.1.1'
          out-file-path: "MXU"
          extract: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up MXU archive
        if: matrix.os != 'android' && (matrix.os != 'linux' || matrix.arch == 'x86_64')
        shell: bash
        run: |
          ARCHIVE_FILE_PATH="${{ fromJson(steps.download_mxu.outputs.downloaded_files)[0] }}"
          rm -f "${ARCHIVE_FILE_PATH}"

      - name: Install jsonc dependency
        run: python -m pip install json-with-comments

      # 构建内嵌 Python 并预装 agent 运行时依赖（android 不内嵌 Python）
      - name: Build embedded Python for agent
        if: matrix.os != 'android'
        shell: bash
        run: |
          python ./tools/install_python.py ./python-embed
          if [[ "${{ matrix.os }}" == "win" ]]; then
            PY="./python-embed/python.exe"
          else
            PY="./python-embed/bin/python3"
          fi
          "$PY" -m pip install --no-warn-script-location -r ./agent/requirements.txt

      - name: Install main version (MFAA)
        if: matrix.os != 'android'
        shell: bash
        run: |
          python ./tools/install.py ${{ needs.meta.outputs.tag }} ${{ matrix.os }} ${{ matrix.arch }}
          if [[ "${{ matrix.os }}" != "android" && -d "MFA" ]]; then
            mkdir -p install
            # rsync 在 Windows runner 的 Git Bash 里不存在，用 cp 代替
            cp -rn MFA/. install/ 2>/dev/null || cp -r MFA/. install/
            if [[ "${{ matrix.os }}" == "win" ]]; then
              if [ -f "install/MFAAvalonia.exe" ]; then mv install/MFAAvalonia.exe install/MRA.exe; fi
            elif [[ "${{ matrix.os }}" == "macos" ]]; then
              if [ -f "install/MFAAvalonia" ]; then mv install/MFAAvalonia install/MRA; elif [ -d "install/MFAAvalonia.app" ]; then mv install/MFAAvalonia.app install/MRA.app; fi
            elif [[ "${{ matrix.os }}" == "linux" ]]; then
              if [ -f "install/MFAAvalonia" ]; then mv install/MFAAvalonia install/MRA; fi
            fi
            if [ -f "logo.ico" ]; then cp logo.ico install/logo.ico; fi
            if [ -d "docs/zh_cn" ]; then mkdir -p install/docs; cp -r docs/zh_cn/. install/docs/; fi
          fi

      - name: Install CLI version
        shell: bash
        run: |
          python ./tools/install_cli.py ${{ needs.meta.outputs.tag }} ${{ matrix.os }} ${{ matrix.arch }}
          if [ -d "docs/zh_cn" ]; then mkdir -p install-cli/docs; cp -r docs/zh_cn/. install-cli/docs/; fi
          if [ -f "logo.ico" ]; then cp logo.ico install-cli/logo.ico; fi

      - name: Install MXU version
        if: matrix.os != 'android' && (matrix.os != 'linux' || matrix.arch == 'x86_64')
        shell: bash
        run: |
          python ./tools/install_mxu.py ${{ needs.meta.outputs.tag }} ${{ matrix.os }} ${{ matrix.arch }}
          if [ -d "MXU" ]; then
            mkdir -p install-mxu
            if [[ "${{ matrix.os }}" == "win" ]]; then
              if [ -f "MXU/mxu.exe" ]; then cp MXU/mxu.exe install-mxu/MRA.exe; fi
            else
              if [ -f "MXU/mxu" ]; then cp MXU/mxu install-mxu/MRA; chmod +x install-mxu/MRA; fi
            fi
            if [ -f "logo.ico" ]; then cp logo.ico install-mxu/logo.ico; fi
            if [ -d "docs/zh_cn" ]; then mkdir -p install-mxu/docs; cp -r docs/zh_cn/. install-mxu/docs/; fi
          fi

      - uses: actions/upload-artifact@v4
        if: matrix.os != 'android'
        with:
          name: MRA-${{ matrix.os }}-${{ matrix.arch }}-MFAA
          path: "install"

      - uses: actions/upload-artifact@v4
        with:
          name: MRA-${{ matrix.os }}-${{ matrix.arch }}-PiCLI
          path: "install-cli"

      - uses: actions/upload-artifact@v4
        if: matrix.os != 'android' && (matrix.os != 'linux' || matrix.arch == 'x86_64')
        with:
          name: MRA-${{ matrix.os }}-${{ matrix.arch }}-MXU
          path: "install-mxu"

  changelog:
    name: Generate changelog
    needs: meta
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .github/cliff.toml
          args: >-
            -vv --latest --strip header
            ${{ needs.meta.outputs.is_prerelease == 'false' && '--tag-pattern "^v[0-9]+\\.[0-9]+\\.[0-9]+$"' || '' }}
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

  release:
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, install, changelog]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - run: |
          cd assets
          for f in *; do
            (cd $f && zip -r ../$f-${{ needs.meta.outputs.tag }}.zip .)
          done
      - uses: softprops/action-gh-release@v2.2.2
        with:
          files: assets/*.zip
          tag_name: ${{ needs.meta.outputs.tag }}
          body: ${{ needs.changelog.outputs.release_body }}
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}
      - name: Trigger MirrorChyanUploading
        if: ${{ github.repository_owner == 'Saratoga-Official' }}
        shell: bash
        run: |
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release.yml -f tag=${{ needs.meta.outputs.tag }}
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release_note.yml -f tag=${{ needs.meta.outputs.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}