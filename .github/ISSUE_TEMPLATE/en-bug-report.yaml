name: Bug Report (English)
description: Recognition errors, operation anomalies, connection errors, etc.
labels: ["bug"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before you ask...
      description: |
        Please confirm you have completed the requirements before checking.
      options:
        - label: I understand that Issues are for reporting and solving problems, not for ranting in the comments. I will provide as much information as possible to help solve the problem.
          required: true
        - label: I have filled in a short and clear title so that developers can quickly identify the general problem when browsing the Issue list, rather than "a suggestion", "stuck", etc.
          required: true
        - label: I am using the latest version of the current update, and I have checked the version releases and Pull Requests for unreleased updates. The bug has not been mentioned as fixed.
          required: true
        - label: I have checked Pinned Issues (announcements), Open Issues, and Closed Issues, and confirmed my problem has not been mentioned.
          required: true
  - type: textarea
    id: describe
    attributes:
      label: Problem Description
      description: Please describe the problem in as much detail as possible.
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Version
      description: >-
        Please provide the software version, resource version, and framework version from the MRA update settings.
      placeholder: |
        MRA Version:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and Configuration Files
      description: |
        **After closing `MRA`, upload the following files according to the GUI you are using:**
          1. If using MFA, click Settings - About Us - Export Logs, then upload the log package.
          2. If using MXU, click Settings - Debug - Export Logs, then upload the log package.
          3. If using MFWAPP (Android), click Settings - Logs - Export Logs, then upload the log package.

        **Please drag and drop the complete files directly, rather than cutting or copying fragments yourself; if the files are too large, compress them before uploading.**
      placeholder: |
        Please confirm MRA is closed before uploading files.
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Configuration Information
      description: |
        Please specify the operating system and version, emulator brand, emulator resolution, DPI, and frame rate.
        Please specify whether GPU accelerated inference is enabled. If enabled, please provide the GPU model.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Screen Recording
      description: |
        You can upload screenshots or recordings to help explain your problem, including but not limited to `MRA` software screenshots and game screen screenshots.
        `MRA` debug screenshots (`debug/vision` path images, obtained after setting `save_draw` to `true` in `config/maa_option.json` and running `MRA` again).
        If it is a **recognition-related problem**, please provide an unobstructed **original image** captured by the emulator's built-in screenshot tool (or via adb) as much as possible.
        Images captured with other tools (such as QQ/WeChat) include window borders and have non-fixed aspect ratios and resolutions, which is not conducive to troubleshooting.
        If the files are too large, compress them before uploading.
      placeholder: |
        Must upload to better determine the problem.
    validations:
      required: true
  - type: textarea
    id: others
    attributes:
      label: Anything Else?
      description: |
        Anything that can give us more understanding of the problem you encountered.
    validations:
      required: false