# Android 打包配方（MaaFwApp）。相对路径相对本文件所在目录（仓库根）。
#
# 参考 MAA1999/M9A 的 Android/profile.yaml，改用相对路径、不再依赖 CI 注入环境变量，
# 配方本身自洽，本地与 CI 共用同一份。
#
# 结构差异说明：M9A 的 PI 资源是扁平的（interface.json、resource/、agent/ 都在仓库根），
# 可以直接 `assets: ..` 一把梭；而 MRA 的 PI 在 assets/ 子目录（interface.json、resource），
# agent/、LICENSE、图标在仓库根，与 assets/ 不同层。MaaFwApp 的 include 只能引用 assets
# 目录内的相对路径，无法跨目录 `../agent`，因此出包前需把 agent/、LICENSE 拷进 assets/，
# 并由 logo.ico 生成 assets/logo.png（见 .github/workflows/android.yml 的 "Stage PI" 步骤）。

# 含 interface.json 那一层
assets: assets

# 进包白名单，相对 assets 目录。写了 include 即整体替换默认值。
include:
  - interface.json
  - resource/**
  - agent/**
  - logo.png
  - LICENSE

# announcement/Announcement.md 是 interface.json 的 welcome 来源，需要保留，故不排除。
exclude: []

# MRA 的 interface.json 声明了 agent（Python，agent/main.py），Android 上必须提供对应运行时，
# 否则开始任务会失败。用 bundle 型运行时（内嵌 CPython）。
agent:
  # build_agent_bundle.py 的产出目录，相对本文件（仓库根）。
  sourceDir: agent-dist
  # 不写死 abi：外壳按 agent-dist 里实际建出的运行时打包（等价于 ["*"]）。
  # 建哪些 ABI 由 build_agent_bundle 的 --abi 决定，必须与 APK 的
  # build.debugAbi / build.releaseAbi 对齐，否则 APK 会宣称支持一个不带运行时的架构。
  runtimes:
    # 条数须与 interface.json 的 agent[] 一一对应；MRA 只有一个 agent。
    # 实际命令 = executable + args + identifier，工作目录为资源解包根，
    # 故 agent/main.py 相对解包根，agent/ 已通过 include 进包。
    - location: bundle
      executable: bin/python3
      args: [-u, agent/main.py]
      env:
        PYTHONHOME: "{bundle}/prefix"
        PYTHONPATH: "{bundle}/site-packages/pure.zip:{bundle}/site-packages"
        LD_LIBRARY_PATH: "{bundle}/prefix/lib:{nativeLibs}"
        MAAFW_BINARY_PATH: "{nativeLibs}"

# Mirror酱 Android 端暂不支持，此 rid 仅占位；不影响 APK 出包。
update:
  mirrorchyanRid: MaaJR

# 包名拼成 com.aliothmoon.maafw.mra；图标须 png/webp（icon 相对本文件，即仓库根）。
app:
  id: mra
  label: MRA
  icon: assets/logo.png
